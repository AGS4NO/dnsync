name: 'dnsync'
description: 'Manage DNS records at DNSimple from a declarative config file (YAML or BIND zone file)'
author: 'ags4no'

branding:
  icon: 'globe'
  color: 'blue'

inputs:
  dnsimple-token:
    description: 'DNSimple API token'
    required: true
  dnsimple-account-id:
    description: 'DNSimple account ID'
    required: true
  config-file:
    description: 'Path to the DNS config file (YAML or BIND zone file)'
    default: 'dns.yaml'
  config-format:
    description: 'Config file format: "yaml" for YAML config, "bind" for BIND zone file'
    default: 'yaml'
  mode:
    description: '"plan" to preview changes, "apply" to execute'
    default: 'plan'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    INPUT_DNSIMPLE_TOKEN: ${{ inputs.dnsimple-token }}
    INPUT_DNSIMPLE_ACCOUNT_ID: ${{ inputs.dnsimple-account-id }}
    INPUT_CONFIG_FILE: ${{ inputs.config-file }}
    INPUT_CONFIG_FORMAT: ${{ inputs.config-format }}
    INPUT_MODE: ${{ inputs.mode }}
